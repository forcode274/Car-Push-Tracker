<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Push Tracker</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f4f6fa;
    --border: #e2e6ee;
    --text: #1a2233;
    --text-dim: #6b7789;
    --accent: #2563eb;
    --accent-2: #f59e0b;
    --danger: #dc2626;
    --good: #16a34a;
    --radius: 18px;
    --shadow: 0 2px 14px rgba(20,32,51,0.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  .app { width: 100%; max-width: 1400px; margin: 0 auto; padding: 26px 28px 34px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; margin-bottom: 30px;
  }
  .logo-box { flex: 0 0 auto; height: 120px; display: flex; align-items: center; }
  .logo-box img { height: 100%; width: auto; max-width: 300px; object-fit: contain; }
  .title-block { text-align: center; flex: 1 1 auto; }
  h1.title {
    margin: 0; font-size: clamp(32px, 4.6vw, 56px);
    font-weight: 800; letter-spacing: -0.02em;
  }
  .subtitle { margin: 6px 0 0; color: var(--text-dim); font-size: clamp(14px, 1.4vw, 18px); }

  .status-row { display: flex; justify-content: center; margin-bottom: 26px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
  }
  .pill.connected { color: var(--good); }
  .pill.error { color: var(--danger); }
  .pill.info { color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .hero-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 26px;
  }

  .hero-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow);
    text-align: center;
  }
  .hero-card h2 {
    margin: 0 0 16px; font-size: 16px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim); font-weight: 700;
  }
  .hero-value {
    font-size: clamp(52px, 8vw, 96px); font-weight: 800;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    line-height: 1.1;
  }
  .hero-value .unit { font-size: 26px; color: var(--text-dim); font-weight: 600; }
  #timerCard.hour-hit { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }

  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo-box"><img src="logo1.png" alt="Logo 1"></div>
    <div class="title-block">
      <h1 class="title">Car Push Tracker</h1>
    </div>
    <div class="logo-box"><img src="logo2.png" alt="Logo 2"></div>
  </div>

  <div class="status-row"><span class="pill" id="connStatus"><span class="dot"></span> Connecting…</span></div>

  <div class="hero-grid">
    <div class="hero-card">
      <h2>Distance Pushed</h2>
      <div class="hero-value"><span id="distanceValue">0.00</span> <span class="unit" id="distanceUnit">m</span></div>
    </div>
    <div class="hero-card" id="timerCard">
      <h2>Session Timer</h2>
      <div class="hero-value" id="timerValue">01:00:00</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
(function () {
  "use strict";
  const el = (id) => document.getElementById(id);

  // ==========================================================================
  // PUBLIC, READ-ONLY connection. This page never publishes anything -- it
  // only subscribes to the telemetry topic. Use a SEPARATE, restricted
  // HiveMQ Cloud credential here (Subscribe-only on this one topic, no
  // Publish permission at all) -- not the full-access credential the ESP32
  // and your private dashboard use.
  // ==========================================================================
  const BROKER_URL     = "wss://YOUR-CLUSTER-ID.s1.eu.hivemq.cloud:8884/mqtt";
  const BROKER_USER     = "public-viewer";
  const BROKER_PASS     = "REPLACE-WITH-THE-RESTRICTED-PASSWORD";
  const TOPIC_TELEMETRY = "cartracker/mycar/telemetry";
  // ==========================================================================

  const connStatus    = el("connStatus");
  const distanceValue = el("distanceValue");
  const distanceUnit  = el("distanceUnit");
  const timerValue    = el("timerValue");
  const timerCard     = el("timerCard");

  function setStatus(kind, text) { connStatus.className = "pill " + kind; connStatus.innerHTML = '<span class="dot"></span> ' + text; }

  // ---- Timer: device-owned (see the .ino) -- this page only displays
  // timer_remaining_s / timer_running from telemetry, ticking smoothly
  // between the ~2s telemetry updates by interpolating locally. Never
  // computed independently here, so it can't drift out of sync with the
  // private dashboard -- both just show whatever the device reports. ----
  function formatHMS(totalSeconds) {
    const t = Math.max(0, Math.floor(totalSeconds));
    const h = String(Math.floor(t / 3600)).padStart(2, "0");
    const m = String(Math.floor((t % 3600) / 60)).padStart(2, "0");
    const s = String(t % 60).padStart(2, "0");
    return h + ":" + m + ":" + s;
  }
  let lastKnownRemainingS = 3600, lastKnownAtMs = Date.now(), deviceTimerRunning = false;
  function tickTimer() {
    let remaining = lastKnownRemainingS;
    if (deviceTimerRunning) remaining = Math.max(0, lastKnownRemainingS - (Date.now() - lastKnownAtMs) / 1000);
    timerValue.textContent = formatHMS(remaining);
    timerCard.classList.toggle("hour-hit", remaining <= 0);
  }
  setInterval(tickTimer, 250);

  // ---- Apply telemetry (display only -- this page never sends anything back) ----
  function applyTelemetry(t) {
    if (typeof t.distance_m === "number") {
      if (t.distance_m < 100) {
        distanceValue.textContent = t.distance_m.toFixed(2);
        distanceUnit.textContent = "m";
      } else {
        distanceValue.textContent = (t.distance_m / 1000).toFixed(3);
        distanceUnit.textContent = "km";
      }
    }
    if (typeof t.timer_remaining_s === "number") {
      lastKnownRemainingS = t.timer_remaining_s;
      lastKnownAtMs = Date.now();
      deviceTimerRunning = !!t.timer_running;
      tickTimer();
    }
  }

  // ---- MQTT: subscribe only, no publish capability exists in this file ----
  function connect() {
    if (typeof mqtt === "undefined") { setStatus("error", "MQTT library failed to load"); return; }
    setStatus("info", "Connecting…");
    const client = mqtt.connect(BROKER_URL, {
      username: BROKER_USER, password: BROKER_PASS,
      clean: true, reconnectPeriod: 4000, connectTimeout: 30000, keepalive: 30,
      protocolVersion: 5, rejectUnauthorized: true
    });
    client.on("connect", () => {
      setStatus("connected", "Live");
      client.subscribe(TOPIC_TELEMETRY, { qos: 0 });
    });
    client.on("reconnect", () => setStatus("info", "Reconnecting…"));
    client.on("close",     () => setStatus("error", "Disconnected"));
    client.on("offline",   () => setStatus("error", "Offline"));
    client.on("error", (e) => setStatus("error", "Connection error"));
    client.on("message", (topic, payload) => { try { applyTelemetry(JSON.parse(payload.toString())); } catch (e) {} });
  }
  connect();
})();
</script>
</body>
</html>
