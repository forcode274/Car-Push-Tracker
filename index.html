<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Record</title>
<style>
/* ==========================================================================
   EDIT ME  —  everything you're likely to change is in this one block.

   Sizes are in "u" units. 1u = 1% of the screen width on a 16:9 screen.
   The page is built as a 16:9 stage that scales to fit ANY screen (extra
   space is just white), so these numbers stay proportional on every display.

   LOGO ROW RULE: (logo sizes added up) + (4 x --logo-gap) must stay under
   about 94, or the row will run off the edges.
   Default: 11 + 11 + 34 + 11 + 11 + (4 x 4) = 94
   ========================================================================== */
:root {
  /* ---- Logo sizes ---- */
  --logo-circle: 11;     /* logos 1, 2, 4 : circle diameter        */
  --logo-rect-w: 34;     /* logo 3        : rectangle width        */
  --logo-rect-h: 9;      /* logo 3        : rectangle height       */
  --logo-square: 11;     /* logo 5        : square side            */
  --logo-gap:    4;      /* space between each pair of logos        */
  --logo-fit:    contain;/* contain = whole logo visible, cover = fill the shape (may crop) */

  /* ---- Text sizes ---- */
  --title-size:     5.6; /* WORLD RECORD                            */
  --subtitle-size:  2.3; /* GREATEST DISTANCE PUSHING A CAR ...     */
  --box-label-size: 3.4; /* DISTANCE / DURATION                     */
  --box-value-size: 8;   /* the big numbers                         */

  /* ---- Layout ---- */
  --side-margin: 3;      /* left/right margin of the whole page     */
  --top-margin:  2.5;    /* space above the logo row                */
  --box-gap:     3;      /* space between DISTANCE and DURATION     */
  --box-border:  0.7;    /* thickness of the black box outline      */
  --box-radius:  0.6;    /* roundness of the box corners (0 = sharp)*/

  /* ---- Colours ---- */
  --red: #c4001d;
  --ink: #111111;
  --bg:  #ffffff;

  /* ---- Tiny connection dot (bottom-right). Set to none to hide it ---- */
  --status-dot-display: block;
}
/* ======================= end of EDIT ME block ============================= */

:root { --u: min(1vw, 1.7778vh); }   /* don't edit: 1u scaling unit */

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body {
  display: flex; align-items: center; justify-content: center;
  font-family: "Arial Black", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  color: var(--ink);
}

.stage {
  position: relative;
  width:  calc(var(--u) * 100);
  height: calc(var(--u) * 56.25);
  display: flex; flex-direction: column;
  padding: calc(var(--u) * var(--top-margin)) calc(var(--u) * var(--side-margin)) calc(var(--u) * 3);
}

/* ---------- Logo row ---------- */
.logos {
  display: flex; align-items: center; justify-content: center;
  gap: calc(var(--u) * var(--logo-gap));
  flex: 0 0 auto;
}
.logo {
  position: relative; flex: 0 0 auto; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.logo img { width: 100%; height: 100%; object-fit: var(--logo-fit); display: block; }
.logo.circle { width: calc(var(--u) * var(--logo-circle)); height: calc(var(--u) * var(--logo-circle)); border-radius: 50%; }
.logo.rect   { width: calc(var(--u) * var(--logo-rect-w));  height: calc(var(--u) * var(--logo-rect-h)); }
.logo.square { width: calc(var(--u) * var(--logo-square));  height: calc(var(--u) * var(--logo-square)); }
/* shown only while a logo file is missing, so you can see the layout */
.logo.missing { border: calc(var(--u) * 0.25) solid var(--ink); }
.logo.missing::after { content: attr(data-label); font-weight: 700; font-size: calc(var(--u) * 1.6); }

/* ---------- Headings ---------- */
.title {
  text-align: center; color: var(--red); font-weight: 900;
  font-size: calc(var(--u) * var(--title-size)); line-height: 1.05;
  margin-top: calc(var(--u) * 1.8);
}
.subtitle {
  text-align: center; color: var(--red); font-weight: 800;
  font-size: calc(var(--u) * var(--subtitle-size)); line-height: 1.15;
  margin-top: calc(var(--u) * 0.8);
}

/* ---------- DISTANCE / DURATION boxes ---------- */
.boxes {
  flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: calc(var(--u) * var(--box-gap));
  margin-top: calc(var(--u) * 2.2);
}
.box {
  display: flex; flex-direction: column; align-items: center;
  border: calc(var(--u) * var(--box-border)) solid var(--ink);
  border-radius: calc(var(--u) * var(--box-radius));
  padding-top: calc(var(--u) * 1.2);
}
.box h2 {
  color: var(--red); font-weight: 900; letter-spacing: 0.02em;
  font-size: calc(var(--u) * var(--box-label-size)); line-height: 1.1;
}
.box .value {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums;
  font-size: calc(var(--u) * var(--box-value-size));
}
.box .unit { font-size: 0.42em; margin-left: 0.25em; }

/* ---------- tiny connection dot ---------- */
.status {
  display: var(--status-dot-display);
  position: absolute; right: calc(var(--u) * 1); bottom: calc(var(--u) * 1);
  width: calc(var(--u) * 0.9); height: calc(var(--u) * 0.9);
  border-radius: 50%; background: #c9c9c9;
}
.status.live  { background: #16a34a; }
.status.error { background: #dc2626; }
</style>
</head>
<body>
<div class="stage">

  <!-- Logo files sit next to this index.html: logo1.png ... logo5.png -->
  <div class="logos">
    <div class="logo circle" data-label="LOGO 1"><img src="logo1.png" alt="Logo 1"></div>
    <div class="logo circle" data-label="LOGO 2"><img src="logo2.png" alt="Logo 2"></div>
    <div class="logo rect"   data-label="LOGO 3"><img src="logo3.png" alt="Logo 3"></div>
    <div class="logo circle" data-label="LOGO 4"><img src="logo4.png" alt="Logo 4"></div>
    <div class="logo square" data-label="LOGO 5"><img src="logo5.png" alt="Logo 5"></div>
  </div>

  <div class="title">WORLD RECORD</div>
  <div class="subtitle">GREATEST DISTANCE PUSHING A CAR IN 60 MINUTES - FEMALE</div>

  <div class="boxes">
    <div class="box">
      <h2>DISTANCE</h2>
      <div class="value"><span id="distanceValue">0.00</span><span class="unit" id="distanceUnit">m</span></div>
    </div>
    <div class="box">
      <h2>DURATION</h2>
      <div class="value" id="timerValue">00:00:00</div>
    </div>
  </div>

  <div class="status" id="statusDot" title="Connection status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
(function () {
  "use strict";
  const el = (id) => document.getElementById(id);

  // ==========================================================================
  // CONNECTION  -- read-only. This page never publishes anything.
  // Use the restricted HiveMQ credential (Subscribe-only on the telemetry
  // topic), NOT the full-access one the ESP32 / private dashboard use.
  // ==========================================================================
  const BROKER_URL      = "wss://35857808dd8b4537aabc6ee9c825c1c9.s1.eu.hivemq.cloud:8884/mqtt";
  const BROKER_USER     = "public-viewer";
  const BROKER_PASS     = "ovit2004";
  const TOPIC_TELEMETRY = "cartracker/mycar/telemetry";
  // ==========================================================================

  // ---- Logos: if a file is missing, show a "LOGO n" outline instead ----
  document.querySelectorAll(".logo").forEach((box) => {
    const img = box.querySelector("img");
    const miss = () => { box.classList.add("missing"); img.remove(); };
    if (img.complete && img.naturalWidth === 0) miss();
    img.addEventListener("error", miss);
  });

  // ---- Distance: metres until 100 m, then km ----
  const distanceValue = el("distanceValue"), distanceUnit = el("distanceUnit");
  function showDistance(d) {
    if (d < 100) { distanceValue.textContent = d.toFixed(2);          distanceUnit.textContent = "m";  }
    else         { distanceValue.textContent = (d / 1000).toFixed(3); distanceUnit.textContent = "km"; }
  }

  // ---- Duration: counts UP 00:00:00 -> 01:00:00 and stops there.
  // The device owns the clock (it reports seconds remaining); this page just
  // shows elapsed = 3600 - remaining, ticking smoothly between updates. ----
  const DURATION_S = 3600;
  const timerValue = el("timerValue");
  let lastRemaining = DURATION_S, lastAt = Date.now(), deviceRunning = false;
  function fmt(totalSeconds) {
    const t = Math.floor(totalSeconds);
    const h = String(Math.floor(t / 3600)).padStart(2, "0");
    const m = String(Math.floor((t % 3600) / 60)).padStart(2, "0");
    const s = String(t % 60).padStart(2, "0");
    return h + ":" + m + ":" + s;
  }
  function tick() {
    let elapsed = DURATION_S - lastRemaining;
    if (deviceRunning) elapsed += (Date.now() - lastAt) / 1000;
    elapsed = Math.min(DURATION_S, Math.max(0, elapsed));
    timerValue.textContent = fmt(elapsed);
  }
  setInterval(tick, 250);

  function applyTelemetry(t) {
    if (typeof t.distance_m === "number") showDistance(t.distance_m);
    if (typeof t.timer_remaining_s === "number") {
      lastRemaining = t.timer_remaining_s;
      lastAt = Date.now();
      deviceRunning = !!t.timer_running;
      tick();
    }
  }

  // ---- MQTT: subscribe only ----
  const dot = el("statusDot");
  const setDot = (cls) => { dot.className = "status " + (cls || ""); };
  function connect() {
    if (typeof mqtt === "undefined") { setDot("error"); return; }
    const client = mqtt.connect(BROKER_URL, {
      username: BROKER_USER, password: BROKER_PASS,
      clean: true, reconnectPeriod: 4000, connectTimeout: 30000, keepalive: 30,
      protocolVersion: 5, rejectUnauthorized: true
    });
    client.on("connect",   () => { setDot("live"); client.subscribe(TOPIC_TELEMETRY, { qos: 0 }); });
    client.on("reconnect", () => setDot(""));
    client.on("close",     () => setDot("error"));
    client.on("offline",   () => setDot("error"));
    client.on("error",     () => setDot("error"));
    client.on("message",   (topic, payload) => { try { applyTelemetry(JSON.parse(payload.toString())); } catch (e) {} });
  }
  connect();
})();
</script>
</body>
</html>
